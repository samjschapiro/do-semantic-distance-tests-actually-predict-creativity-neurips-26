# Config for running DAT, CDAT, and PACE evaluations.
# The 75 models in the paper (OpenRouter IDs). Responses used in the paper are in
# data/responses/; this config writes to a new folder.
output_dir: "outputs/responses_new"

# Optional budget cap in USD (0 = no cap). With a cap, list prices under `pricing:`
# as {model_id: [usd_per_M_input, usd_per_M_output]}; unpriced models stop the run.
budget_usd: 0.0
# pricing:
#   openai/gpt-4o: [2.5, 10.0]

# Max concurrent in-flight API calls. OpenRouter's rate ceiling scales with
# credit balance (~$34 ≈ 30 req/s). 20 leaves headroom for retries.
concurrency: 20

# Reasoning control for reasoning-enabled models (QwQ, o-series, DeepSeek R1,
# Claude extended thinking). Forwarded to OpenRouter's unified reasoning API.
# Low effort + hard cap on thinking tokens keeps reasoning models from spending
# minutes on each simple word-generation task.
reasoning:
  effort: "low"
  exclude: true

# Per-eval temperature lists
# DAT/CDAT: temps 1.0, 1.5, 2.0 to get meaningful variance — lower temps produce
# near-deterministic "canonical answers" even with seed variation
# PACE: temp=0.0 per the original Qiu & Hu paper (variance from 50 distinct seeds)
dat_temperatures: [1.0, 1.5, 2.0]
cdat_temperatures: [1.0, 1.5, 2.0]
pace_temperatures: [0.0]

# Sampling controls — for DAT/CDAT we want maximum diversity, so disable nucleus
# and top-k filtering. Provider defaults often apply top_p~0.9 which suppresses
# tail tokens and prevents temperature from breaking canonical-answer priors.
dat_top_p: 1.0
dat_top_k: 0
cdat_top_p: 1.0
cdat_top_k: 0
# PACE: leave at provider defaults (paper doesn't specify; only sets temp=0)

# Max output tokens per call — these are BASE values for non-reasoning models.
# Reasoning models automatically get `base * reasoning_max_tokens_multiplier`
# (default 4x) since reasoning tokens count toward the cap.
# Keeping base tight prevents runaway token generation at high temperatures
# on non-reasoning models.
dat_max_tokens: 256           # 10 words in JSON
cdat_max_tokens: 256          # 10 words in JSON
pace_stage1_max_tokens: 400   # 3 words with reasons
pace_stage2_max_tokens: 1200  # 20 words with reasons (can get verbose)
reasoning_max_tokens_multiplier: 4  # reasoning models get 4× the base

dat_trials: 40

evals:
  - dat
  - cdat
  - pace

# Models ordered: non-reasoning cheap-to-expensive first, then reasoning models last.
# Reasoning models (qwq, o3*, o4-mini, deepseek-r1) are much slower per-call even with
# low reasoning effort. Running them last means we still get data from everyone else
# if we hit the budget cap or time out.
